; Subzero tool-changer firmware — ESP32-S3-DevKitC-1
; Contract: docs/contracts.md §C.2 (ESP32 HTTP API v0) — implement byte-identically, never rename.
; Skills: esp32-tool-firmware:esp32s3-platformio-arduino, esp32-tool-firmware:tool-http-servo-firmware

[env:esp32-s3-devkitc-1]
platform  = espressif32          ; core 3.2.0 / ESP-IDF 5.4 (already installed)
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D TOOL_ID=1
    -D TOOL_IP_LAST_OCTET=31
    ; tool 2 -> -D TOOL_ID=2 -D TOOL_IP_LAST_OCTET=32 (see [env:tool2] below)
    ; tool 3 -> -D TOOL_ID=3 -D TOOL_IP_LAST_OCTET=33

lib_deps =
    madhephaestus/ESP32Servo @ ^3.2.1
    bblanchon/ArduinoJson @ ^7.4.3

; Second physical tool board: `pio run -e tool2 -t upload`
[env:tool2]
extends   = env:esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D TOOL_ID=2
    -D TOOL_IP_LAST_OCTET=32
