; Subzero END-EFFECTOR firmware — ESP32-S3-DevKitC-1, one board per swappable end effector.
; Actuator: brushed DC motor on a DRV8833 H-bridge + potentiometer position feedback,
; wrapped as an emulated hobby servo (EmuServo). NO servo library.
; Contract: docs/contracts.md §C.2 (ESP32 HTTP API v0) — implemented byte-identically, never renamed.
; Reference lifted from: esp32/legacy-servo-tool/ (WiFi STA static IP, sync WebServer, seq dedup,
; OK/LOST_LINK/ESTOP state machine, task WDT, RGB status LED, ArduinoJson 7).

[common]
platform      = espressif32          ; core 3.2.0 / ESP-IDF 5.4 (already installed)
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3

; End effector 1 -> tool id 1, 10.13.60.31  (`pio run -e endeffector-1 -t upload`)
[env:endeffector-1]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps      = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -D TOOL_ID=1
    -D TOOL_IP_LAST_OCTET=31

; End effector 2 -> tool id 2, 10.13.60.32  (`pio run -e endeffector-2 -t upload`)
[env:endeffector-2]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps      = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -D TOOL_ID=2
    -D TOOL_IP_LAST_OCTET=32

; End effector 3 (slot reserved, H-09): copy [env:endeffector-2], rename endeffector-3,
; set -D TOOL_ID=3 -D TOOL_IP_LAST_OCTET=33.
