; Subzero pincher firmware — ESP32-S3-DevKitC-1
; Contract: docs/contracts.md §C.2 (ESP32 HTTP API v0) — implement byte-identically, never rename.
; Semantics for THIS board: /latch and /release pinch/open mirrored jaws; /lateral sets jaw gap
; (mm). Tool id 0, static IP 10.13.60.30. See README.md for the ESTOP=HOLD rationale (differs
; from the end-effector boards, which DETACH per gate decision H-11).
; Skills: esp32-tool-firmware:esp32s3-platformio-arduino, esp32-tool-firmware:tool-http-servo-firmware

[env:pincher]
platform  = espressif32          ; core 3.2.0 / ESP-IDF 5.4 (already installed)
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D TOOL_ID=0
    -D TOOL_IP_LAST_OCTET=30

lib_deps =
    madhephaestus/ESP32Servo @ ^3.2.1
    bblanchon/ArduinoJson @ ^7.4.3
