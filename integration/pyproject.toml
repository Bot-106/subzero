[project]
name = "subzero-integration"
version = "0.1.0"
description = "Subzero laptop-side bridge: NT4 client (pyntcore) <-> ESP32 tool HTTP; mock tool; HRI CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "robotpy>=2026.2.2",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.uv]
package = false
